services:

  # ─── Fila e cache de estado ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # persiste mensagens em disco

  # ─── Storage S3-compatível (substitui AWS S3 no ambiente local) ──────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"    # API S3 (boto3 aponta para cá)
      - "9001:9001"    # Console web → http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  redis_data:
  minio_data:
